<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-label="How I build: 1. Understand the business problem. 2. Make the UX feel obvious. 3. Keep the architecture maintainable. 4. Automate repetitive work. 5. Measure what actually matters. 6. Ship — then improve.">
