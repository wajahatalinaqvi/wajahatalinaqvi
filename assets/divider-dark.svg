<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" fill="none" role="img" aria-label="Section divider">
  <title>Section divider</title>
  <style>
    .sans{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
    .mono{font-family:'Geist Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .text{fill:#e6edf3} .muted{fill:#8b98a5} .faint{fill:#3a4654} .mint{fill:#63e6be}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    .run{animation:run 7s ease-in-out infinite}
    @keyframes run{0%{transform:translateX(-220px)}100%{transform:translateX(1220px)}}
  </style>
  <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#63e6be" stop-opacity="0"/><stop offset=".5" stop-color="#63e6be"/><stop offset="1" stop-color="#63e6be" stop-opacity="0"/></linearGradient></defs>
  <path d="M0 12H1200" stroke="#1c2631"/>
  <rect class="run" y="11" width="200" height="2" fill="url(#dg)"/>
  <rect x="595" y="7" width="10" height="10" transform="rotate(45 600 12)" fill="#0b0f14" stroke="#63e6be" stroke-width="1.5"/>
</svg>
