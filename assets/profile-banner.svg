<svg width="1400" height="430" viewBox="0 0 1400 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.46" stop-color="#111827"/>
      <stop offset="1" stop-color="#071B2C"/>
    </linearGradient>
    <linearGradient id="title" x1="260" y1="118" x2="1120" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#C4B5FD"/>
      <stop offset="0.76" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="blur40" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1400" height="430" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1400" height="430" rx="28" fill="url(#bg)"/>
    <rect width="1400" height="430" fill="url(#grid)"/>

    <circle cx="1180" cy="40" r="210" fill="#0EA5E9" fill-opacity="0.13" filter="url(#blur40)">
      <animate attributeName="cx" values="1180;1090;1180" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="40;100;40" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="410" r="225" fill="#8B5CF6" fill-opacity="0.14" filter="url(#blur40)">
      <animate attributeName="cx" values="230;330;230" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="390" r="150" fill="#06B6D4" fill-opacity="0.08" filter="url(#blur40)">
      <animate attributeName="cy" values="390;325;390" dur="7s" repeatCount="indefinite"/>
    </circle>

    <path d="M0 354C220 303 392 391 598 344C785 302 1040 288 1400 337V430H0V354Z" fill="#0B1220" fill-opacity="0.6"/>
    <path d="M0 363C221 317 392 393 603 352C816 310 1071 310 1400 346" stroke="url(#ring)" stroke-width="2" stroke-opacity="0.34">
      <animate attributeName="stroke-opacity" values="0.2;0.65;0.2" dur="4s" repeatCount="indefinite"/>
    </path>

    <g transform="translate(92 86)">
      <circle cx="90" cy="90" r="78" fill="#0F172A" stroke="url(#ring)" stroke-width="3"/>
      <circle cx="90" cy="90" r="62" fill="#111827" stroke="#334155"/>
      <text x="90" y="108" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">WN</text>
      <circle cx="145" cy="35" r="8" fill="#22D3EE" filter="url(#glow)">
        <animate attributeName="r" values="6;10;6" dur="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="300" y="103" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4">COMMERCE • PRODUCT • AI</text>
    <text x="298" y="190" fill="url(#title)" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">WAJAHAT NAQVI</text>
    <text x="302" y="242" fill="#D8E2F0" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600">Shopify Developer  •  Full-stack Engineer  •  AI Builder</text>

    <g transform="translate(302 286)">
      <rect width="150" height="42" rx="21" fill="#0F172A" stroke="#86EFAC" stroke-opacity="0.55"/>
      <text x="75" y="27" text-anchor="middle" fill="#86EFAC" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">SHOPIFY</text>

      <rect x="166" width="130" height="42" rx="21" fill="#0F172A" stroke="#93C5FD" stroke-opacity="0.55"/>
      <text x="231" y="27" text-anchor="middle" fill="#93C5FD" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">REACT</text>

      <rect x="312" width="142" height="42" rx="21" fill="#0F172A" stroke="#FDA4AF" stroke-opacity="0.55"/>
      <text x="383" y="27" text-anchor="middle" fill="#FDA4AF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">LARAVEL</text>

      <rect x="470" width="104" height="42" rx="21" fill="#0F172A" stroke="#C4B5FD" stroke-opacity="0.55"/>
      <text x="522" y="27" text-anchor="middle" fill="#C4B5FD" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1">AI</text>
    </g>

    <g opacity="0.75">
      <circle cx="1210" cy="195" r="5" fill="#67E8F9">
        <animate attributeName="cy" values="195;180;195" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1260" cy="255" r="4" fill="#A78BFA">
        <animate attributeName="cy" values="255;236;255" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1160" cy="290" r="3.5" fill="#60A5FA">
        <animate attributeName="cy" values="290;272;290" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="1090" y="392" fill="#64748B" font-family="monospace" font-size="16">&gt; building useful things_</text>
    <rect x="1310" y="376" width="9" height="20" rx="1" fill="#67E8F9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
