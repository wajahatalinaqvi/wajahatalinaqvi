<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="1" y="1" width="1398" height="418" rx="28"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .cursor { animation: blink 1.15s steps(1,end) infinite; }
      .signal { animation: signal 5.5s ease-in-out infinite; transform-origin: center; }
      @keyframes blink { 0%,48% { opacity:1 } 49%,100% { opacity:0 } }
      @keyframes signal { 0%,100% { opacity:.32 } 50% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) {
        .cursor,.signal { animation:none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1400" height="420" rx="28" fill="#0B0D10"/>
    <rect x="1" y="1" width="1398" height="418" rx="27" stroke="#232832"/>

    <!-- restrained editorial grid -->
    <path d="M82 72H1318" stroke="#20252D"/>
    <path d="M82 324H1318" stroke="#20252D"/>
    <path d="M1008 72V324" stroke="#20252D"/>

    <!-- left identity -->
    <text x="82" y="108" class="mono" fill="#7D8796" font-size="15" font-weight="600" letter-spacing="2.8">
      WAJAHAT / GITHUB PROFILE
    </text>

    <text x="82" y="205" class="sans" fill="#F5F7FA" font-size="78" font-weight="760" letter-spacing="-3.4">
      Wajahat Naqvi
    </text>

    <text x="86" y="257" class="sans" fill="#A8B0BC" font-size="27" font-weight="500" letter-spacing="-0.4">
      Shopify Developer · Full-stack Engineer · AI Builder
    </text>

    <rect x="83" y="286" width="330" height="3" rx="1.5" fill="url(#accent)"/>

    <!-- right monogram / designed mark -->
    <g transform="translate(1060 102)">
      <rect width="256" height="164" rx="24" fill="#10141A" stroke="#2A313C"/>
      <text x="28" y="38" class="mono" fill="#657080" font-size="13" font-weight="600" letter-spacing="2.2">WN / 2026</text>
      <text x="28" y="124" class="sans" fill="#F5F7FA" font-size="82" font-weight="760" letter-spacing="-5">WN</text>
      <circle cx="219" cy="33" r="5" fill="#67E8F9" class="signal"/>
    </g>

    <!-- bottom capability rail -->
    <g class="sans" font-size="14" font-weight="650" letter-spacing="1.5">
      <text x="82" y="365" fill="#C8D0DA">SHOPIFY</text>
      <circle cx="188" cy="360" r="2.5" fill="#3F4753"/>
      <text x="209" y="365" fill="#C8D0DA">REACT / NEXT.JS</text>
      <circle cx="374" cy="360" r="2.5" fill="#3F4753"/>
      <text x="395" y="365" fill="#C8D0DA">LARAVEL / APIs</text>
      <circle cx="558" cy="360" r="2.5" fill="#3F4753"/>
      <text x="579" y="365" fill="#C8D0DA">AUTOMATION</text>
      <circle cx="705" cy="360" r="2.5" fill="#3F4753"/>
      <text x="726" y="365" fill="#C8D0DA">AI WORKFLOWS</text>
    </g>

    <text x="1060" y="365" class="mono" fill="#748091" font-size="14">
      building useful things<tspan fill="#67E8F9" class="cursor">_</tspan>
    </text>
  </g>
</svg>
