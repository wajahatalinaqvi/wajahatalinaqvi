<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="82" y1="0" x2="1030" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.52" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67E8F9" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1398" height="418" rx="28"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .cursor { animation: blink 1.15s steps(1,end) infinite; }
      .pulse { animation: pulse 3.6s ease-in-out infinite; }
      .sweep { animation: sweep 7s ease-in-out infinite; }
      @keyframes blink { 0%,48%{opacity:1}49%,100%{opacity:0} }
      @keyframes pulse { 0%,100%{opacity:.38}50%{opacity:1} }
      @keyframes sweep { 0%{transform:translateX(-520px)} 50%,100%{transform:translateX(1220px)} }
      @media (prefers-reduced-motion: reduce) { .cursor,.pulse,.sweep{animation:none} }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1400" height="420" rx="28" fill="#0A0C10"/>
    <rect x="1" y="1" width="1398" height="418" rx="27" stroke="#242A33"/>

    <text x="82" y="88" class="mono" fill="#737D8C" font-size="15" font-weight="600" letter-spacing="2.6">
      GITHUB PROFILE / 2026
    </text>

    <text x="80" y="206" class="sans" fill="#F7F8FA" font-size="86" font-weight="760" letter-spacing="-4.2">
      Wajahat Naqvi
    </text>

    <text x="84" y="258" class="sans" fill="#AAB2BE" font-size="27" font-weight="500" letter-spacing="-0.45">
      Shopify Developer · Full-stack Engineer · AI Builder
    </text>

    <rect x="83" y="292" width="716" height="3" rx="1.5" fill="#222831"/>
    <g class="sweep">
      <rect x="83" y="292" width="280" height="3" rx="1.5" fill="url(#sweep)"/>
    </g>

    <g transform="translate(1032 94)">
      <text x="0" y="0" class="mono" fill="#6F7988" font-size="13" font-weight="600" letter-spacing="2">FOCUS</text>

      <text x="0" y="52" class="sans" fill="#DCE1E7" font-size="20" font-weight="650">Commerce systems</text>
      <text x="0" y="91" class="sans" fill="#DCE1E7" font-size="20" font-weight="650">Product engineering</text>
      <text x="0" y="130" class="sans" fill="#DCE1E7" font-size="20" font-weight="650">Automation + AI</text>

      <circle cx="2" cy="176" r="4.5" fill="#67E8F9" class="pulse"/>
      <text x="18" y="181" class="mono" fill="#8C96A5" font-size="13">build / ship / iterate</text>
    </g>

    <path d="M82 333H1318" stroke="#20252D"/>

    <g class="sans" font-size="14" font-weight="650" letter-spacing="1.35">
      <text x="82" y="371" fill="#C9D0D8">SHOPIFY</text>
      <circle cx="187" cy="366" r="2.4" fill="#434B57"/>
      <text x="208" y="371" fill="#C9D0D8">REACT / NEXT.JS</text>
      <circle cx="373" cy="366" r="2.4" fill="#434B57"/>
      <text x="394" y="371" fill="#C9D0D8">LARAVEL / APIs</text>
      <circle cx="557" cy="366" r="2.4" fill="#434B57"/>
      <text x="578" y="371" fill="#C9D0D8">AUTOMATION</text>
      <circle cx="705" cy="366" r="2.4" fill="#434B57"/>
      <text x="726" y="371" fill="#C9D0D8">AI WORKFLOWS</text>
    </g>

    <text x="1082" y="371" class="mono" fill="#707A89" font-size="14">
      building useful things<tspan fill="#67E8F9" class="cursor">_</tspan>
    </text>
  </g>
</svg>