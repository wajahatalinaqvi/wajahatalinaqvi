name: Rebuild GitHub signal

# Regenerates the profile's live visuals (stats card + contribution snake) and publishes them
# to the `output` branch, which README.md reads from. Nothing is committed to main.
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/signal.mjs"
      - "scripts/theme.mjs"
      - ".github/workflows/signal.yml"

permissions:
  contents: write

concurrency:
  group: signal
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build stats card
        run: node scripts/signal.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#087f5b&color_dots=#ebedf0,#c3f0e1,#8de0c6,#3cc49a,#0ca678
            dist/snake-dark.svg?palette=github-dark&color_snake=#63e6be&color_dots=#161b22,#123d33,#1c6b55,#2ea383,#63e6be

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
